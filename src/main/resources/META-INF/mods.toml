## Dependencies
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="raccooncore"
mandatory=true
versionRange="${raccooncore_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="heartstone"
mandatory=true
versionRange="${heartstone_version_range}"
ordering="AFTER"
side="BOTH"